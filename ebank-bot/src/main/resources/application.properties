spring.application.name=ebank-bot
server.port=8058

# .env is read whether the service starts from the project root or from its own folder
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# Google Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=0.2

# MCP client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.streamable-http.connections.customer.url=${CUSTOMER_MCP_URL:http://localhost:8085}
spring.ai.mcp.client.streamable-http.connections.ebank.url=${EBANK_MCP_URL:http://localhost:8057}

spring.mvc.async.request-timeout=120s
management.endpoints.web.exposure.include=health,info

# Optional channels, off while the token is empty. Allowed users: comma separated ids, empty means nobody
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.allowed-users=${TELEGRAM_ALLOWED_USERS:}
discord.bot.token=${DISCORD_BOT_TOKEN:}
discord.bot.allowed-users=${DISCORD_ALLOWED_USERS:}

# Only this machine can reach the service, other devices cannot
server.address=${SERVICE_BIND:127.0.0.1}
