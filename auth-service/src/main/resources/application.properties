spring.application.name=auth-service
server.port=8059
server.address=${SERVICE_BIND:127.0.0.1}

spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# A file database: registered users survive a restart
spring.datasource.url=${AUTH_DB_URL:jdbc:h2:file:./data/auth-db}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

auth.jwt.secret=${JWT_SECRET}
auth.jwt.validity=8h

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

management.endpoints.web.exposure.include=health
