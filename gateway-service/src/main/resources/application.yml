server:
  port: 9999
  address: ${SERVICE_BIND:127.0.0.1}

spring:
  application:
    name: gateway-service
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  cloud:
    gateway:
      server:
        webflux:
          # text/plain is flushed chunk by chunk so that the chatbot can stream
          streaming-media-types:
            - text/event-stream
            - text/plain

auth:
  jwt:
    secret: ${JWT_SECRET}

gateway:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    hostname: ${SERVICE_HOST:localhost}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
