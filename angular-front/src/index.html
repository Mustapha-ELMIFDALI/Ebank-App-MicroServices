<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>E-Bank ElMifdali</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Customers, bank accounts and the assistant of E-Bank">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the color mode before the first paint
    (function () {
      var theme;
      try { theme = localStorage.getItem('ebank-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
