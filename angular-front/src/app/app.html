<a class="skip-link btn btn-primary" href="#main" (click)="skipToContent(main, $event)">Skip to content</a>
@if (loading.isLoading()) {
  <div class="request-progress bg-primary" aria-hidden="true"></div>
}

<header>
  <nav class="navbar navbar-expand-xl bg-body-tertiary border-bottom" aria-label="Main">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/" (click)="menuOpen.set(false)">E-Bank · ElMifdali</a>
      <div class="d-flex gap-2 order-xl-last ms-xl-2">
        <button type="button" class="btn btn-outline-secondary theme-switch" (click)="theme.toggle()"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Use light mode' : 'Use dark mode'">
          <i class="bi" [class]="theme.theme() === 'dark' ? 'bi-sun-fill' : 'bi-moon-stars-fill'" aria-hidden="true"></i>
        </button>
        @if (auth.signedIn()) {
          <button type="button" class="btn btn-outline-secondary sign-out" (click)="auth.signOut()"
            [title]="'Signed in as ' + auth.user()?.name" aria-label="Sign out">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span class="d-none d-xxl-inline ms-1">Sign out</span>
          </button>
          <button class="navbar-toggler" type="button" (click)="menuOpen.set(!menuOpen())"
            aria-controls="main-menu" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
        }
      </div>
      @if (auth.signedIn()) {
        <div class="collapse navbar-collapse" id="main-menu" [class.show]="menuOpen()">
          <ul class="navbar-nav me-auto mb-2 mb-xl-0">
            @for (page of pages; track page.path) {
              <li class="nav-item">
                <a class="nav-link" [routerLink]="page.path" routerLinkActive="active fw-semibold" ariaCurrentWhenActive="page"
                  [routerLinkActiveOptions]="{ exact: page.path === '/' }" (click)="menuOpen.set(false)">{{ page.label }}</a>
              </li>
            }
          </ul>
          <form class="d-flex" role="search" (submit)="search(searchInput.value, $event)">
            <input #searchInput class="form-control me-2" type="search" placeholder="Search accounts" aria-label="Search accounts" />
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>
        </div>
      }
    </div>
  </nav>
</header>

<main #main id="main" tabindex="-1">
  <router-outlet />
</main>
