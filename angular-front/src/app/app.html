<a class="skip-link" href="#main" (click)="skipToContent(main, $event)">Skip to content</a>

<svg class="lattice" aria-hidden="true">
  <defs>
    <pattern id="zellige" width="112" height="112" patternUnits="userSpaceOnUse">
      <path d="M28 28h56v56H28z M56 16.4 95.6 56 56 95.6 16.4 56z" />
      <path d="M0 0 28 28 M112 0 84 28 M0 112 28 84 M112 112 84 84 M56 0v16.4 M56 95.6V112 M0 56h16.4 M95.6 56H112" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#zellige)" />
</svg>
<div class="tiles" aria-hidden="true"><i class="tile tile-blue"></i><i class="tile tile-lagoon"></i><i class="tile tile-saffron"></i></div>

<div class="progress" [class.is-active]="loading.isLoading()" aria-hidden="true"></div>

@if (auth.signedIn()) {
<header class="rail glass">
  <a class="brand" routerLink="/" aria-label="E-Bank wallet">
    <img src="favicon.svg" width="46" height="46" alt="" />
    <span>E-Bank</span>
  </a>

  <nav class="dock" aria-label="Main">
    @for (page of pages; track page.path) {
      <a
        [routerLink]="page.path"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="ph" [class]="page.icon" aria-hidden="true"></i>
        <span>{{ page.label }}</span>
      </a>
    }
  </nav>

  <div class="rail-end">
  <button #toggle type="button" class="theme-switch" (click)="theme.toggle(toggle)"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Use light mode' : 'Use dark mode'">
    <i class="ph" [class]="theme.theme() === 'dark' ? 'ph-sun' : 'ph-moon-stars'" aria-hidden="true"></i>
    <span>{{ theme.theme() === 'dark' ? 'Light' : 'Dark' }}</span>
  </button>
  <button type="button" class="theme-switch sign-out" (click)="auth.signOut()"
    [title]="'Signed in as ' + auth.user()?.name" aria-label="Sign out">
    <i class="ph ph-sign-out" aria-hidden="true"></i>
    <span>Sign out</span>
  </button>
  </div>
</header>
}

<main #main id="main" class="stage" [class.stage-gate]="!auth.signedIn()" tabindex="-1">
  <router-outlet />
</main>
