<div class="gate">
  <section class="gate-vault" aria-label="About E-Bank">
    <app-seal class="gate-seal" [value]="seed()" [rings]="16" />
    <p class="gate-brand"><img src="favicon.svg" width="46" height="46" alt="" />E-Bank</p>
    <p class="gate-line">Every account carries its own seal. So will you.</p>
    <div class="pass note note-saving" aria-hidden="true">
      <app-seal class="note-seal" [value]="seed()" />
      <span class="note-top"><span class="note-bank">E-Bank</span><span class="note-type">Banker</span></span>
      <span class="pass-name">{{ title() }}</span>
      <span class="pass-email">{{ email() || 'name@example.com' }}</span>
    </div>
  </section>

  <section class="gate-form glass">
    <button #toggle type="button" class="round gate-theme" (click)="theme.toggle(toggle)"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Use light mode' : 'Use dark mode'">
      <i class="ph" [class]="theme.theme() === 'dark' ? 'ph-sun' : 'ph-moon-stars'" aria-hidden="true"></i>
    </button>
    <div class="gate-body"><ng-content /></div>
  </section>
</div>
