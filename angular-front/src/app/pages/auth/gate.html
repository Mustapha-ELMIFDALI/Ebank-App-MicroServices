<div class="container py-4 py-lg-5">
  <div class="card photo-card auth-card shadow mx-auto">
    <div class="row g-0">
      <div class="col-md-6 auth-photo" [class]="'auth-photo-' + screen()">
        <img [src]="'images/' + screen() + '.jpg'" alt="" />
        <p class="display-6 fw-bold p-4 p-lg-5 mb-0">
          {{ screen() === 'login' ? 'The door is open for you' : 'Banking that fits in your hand' }}
        </p>
      </div>
      <div class="col-md-6 d-flex align-items-center">
        <div class="w-100 p-4 p-lg-5"><ng-content /></div>
      </div>
    </div>
  </div>
</div>
